<!DOCTYPE html>
<HTML>
	<HEAD>
		<TITLE>暗号化</TITLE>

		<META NAME="theme-color" CONTENT="#FED6E3">

		<LINK REL="stylesheet" HREF="https://cdn.rumia.me/CSS/reset.css">
		<LINK REL="stylesheet" HREF="https://cdn.rumia.me/CSS/DEFAULT.css">
		<LINK REL="stylesheet" HREF="https://cdn.rumia.me/CSS/font.css">
		<LINK REL="stylesheet" HREF="https://cdn.rumia.me/CSS/icon.css">


		<STYLE>
			body{
				background: var(--RSV_DEFAULT_BG);
				width: 100vw;
				height: 100vh;
			}

			.SETUP{
				text-align: center;
			}
		</STYLE>
	</HEAD>

	<BODY>
		<DIV CLASS="PLATE PLATE_CENTER">
			<DIV ID="LOADING">
				お待ち下さい。
			</DIV>

			<DIV ID="OK" STYLE="display: none;">
				暗号化はセットアップ済みでｗす
			</DIV>

			<DIV CLASS="SETUP" ID="SETUP" STYLE="display: none;">
				<DIV ID="SETUP_FIRST">
					<H1>暗号化のセットアップ</H1>
					6桁のパスコードを設定してください！<BR>
					(絶対に忘れない番号にしましょう)<BR>
					<INPUT PLACEHOLDER="000000" ID="SETUP_INPUT" TYPE="text" onkeyup="setup_input_change();" MAXLENGTH="6"><BR>
					<BUTTON onclick="setup_next();" ID="SETUP_NEXT" disabled>これで行く</BUTTON>
				</DIV>
				<DIV ID="SETUP_CHECK" STYLE="display: none;">
					パスコード<SPAN ID="SETUP_PASSCODE"></SPAN>で続行しますか？<BR>
					後からパスコードを変更することは出来ません。<BR>
					<FONT COLOR="RED">また、パスコードリセットをした場合、<BR>重要なデータなどが消失する場合があります。</FONT><BR>
					<BUTTON onclick="setup_go();">問題ありません</BUTTON>
				</DIV>
				<DIV ID="SETUP_LOADING" STYLE="display: none;">
					お待ち下さい。
				</DIV>
			</DIV>
		</DIV>
	</BODY>

	<SCRIPT SRC="https://cdn.rumia.me/LIB/COOKIE.js?V=LATEST"></SCRIPT>
	<SCRIPT SRC="https://cdn.rumia.me/LIB/Login.js?V=LATEST"></SCRIPT>

	<SCRIPT SRC="/Script/Setup.js"></SCRIPT>
	<SCRIPT SRC="/Script/Main.js" defer></SCRIPT>
</HTML>
